{% extends "base.html" %}

{% block content %}

<div class="page-header mb-4">
    <div>
        <h1>Registrar movimiento</h1>
        <p>Registra una entrada, consumo o descarte de un producto.</p>
    </div>
</div>

<section class="panel">

    <form method="post" action="/movimientos/nuevo">

        <div class="mb-3">
            <label class="form-label">Producto</label>

            <select name="id_producto" class="form-select" required>
                <option value="">Selecciona un producto</option>

                {% for product in products %}
                    <option value="{{ product.codigo }}">
                            {{ product.nombre }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo de movimiento</label>

            <select name="tipo_movimiento" class="form-select" required>
                <option value="">Selecciona un tipo</option>
                <option value="Entrada">Entrada</option>
                <option value="Consumo">Consumo</option>
                <option value="Descarte">Descarte</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Cantidad</label>

            <input
                type="number"
                name="cantidad"
                class="form-control"
                min="1"
                step="1"
                required
            >
        </div>

        <div class="d-flex gap-2">
            <a href="/movimientos" class="btn btn-secondary">
                Cancelar
            </a>

            <button type="submit" class="btn btn-primary">
                Registrar movimiento
            </button>
        </div>

    </form>

</section>

{% endblock %}
